<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الدكتور محمد إسماعيل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); direction: rtl; padding: 20px; }

        .container { max-width: 1000px; margin: 0 auto; }
        
        /* شاشة تسجيل الدخول */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: flex; justify-content: center;
            align-items: center; z-index: 9999; backdrop-filter: blur(5px);
        }
        .login-card {
            background: var(--card-bg); padding: 35px; border-radius: 20px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h2 { margin-bottom: 20px; color: #0f172a; font-size: 22px; }
        .login-card input {
            width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid var(--border-color);
            border-radius: 10px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,0.15); }
        .login-card button {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer;
            transition: 0.3s;
        }
        .login-card button:hover { background: #0284c7; }
        .login-error { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

        /* لوحة التحكم الرئيسية */
        #adminDashboard { display: none; }
        
        .admin-header { 
            background: var(--card-bg); padding: 20px 25px; border-radius: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; 
            justify-content: space-between; align-items: center; margin-bottom: 20px; 
            flex-wrap: wrap; gap: 15px;
        }
        .admin-header h1 { font-size: 18px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .admin-header h1 i { color: var(--primary); }
        
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-logout { background: #fee2e2; color: var(--danger); border: none; padding: 6px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: #fecaca; }

        /* شريط البحث */
        .search-box {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-box i { color: #94a3b8; font-size: 16px; }
        .search-box input {
            width: 100%; border: none; outline: none; font-size: 14.5px; background: transparent; color: var(--text-color);
        }
        .search-box input::placeholder { color: #94a3b8; }

        /* شريط التبويبات والفرز */
        .filter-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            color: #64748b;
        }
        .tab-btn span {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #475569;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--primary); }
        
        /* ألوان التبويبات النشطة */
        .tab-btn.active-all { background: #e0f2fe; border-color: var(--primary); color: #0369a1; }
        .tab-btn.active-all span { background: #bae6fd; color: #0369a1; }

        .tab-btn.active-pending { background: #fef3c7; border-color: var(--warning); color: #b45309; }
        .tab-btn.active-pending span { background: #fde68a; color: #b45309; }

        .tab-btn.active-accepted { background: #d1fae5; border-color: var(--success); color: #065f46; }
        .tab-btn.active-accepted span { background: #a7f3d0; color: #065f46; }

        .tab-btn.active-rejected { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
        .tab-btn.active-rejected span { background: #fecaca; color: #991b1b; }

        .orders-grid { display: grid; gap: 15px; }
        
        .order-card { 
            background: var(--card-bg); border-radius: 14px; padding: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-info { margin-bottom: 15px; }
        .order-info h3 { font-size: 16px; color: #0f172a; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;}
        
        /* تفاصيل المريض */
        .patient-details-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            font-size: 13.5px;
            color: #334155;
            line-height: 1.8;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
        }
        .patient-details-box span { font-weight: bold; color: #0f172a; }
        
        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .queue-input-group {
            display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .queue-input-group label { font-size: 13px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 6px; }
        .queue-input-group input {
            padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 8px; width: 110px; text-align: center; font-weight: bold; font-size: 14px; outline: none; background: #fff;
        }

        .order-actions { display: flex; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 15px; flex-wrap: wrap; align-items: center; }
        
        .btn-action { 
            padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; 
            cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; 
        }
        .btn-accept { background: #d1fae5; color: #065f46; }
        .btn-accept:hover { background: #a7f3d0; }
        
        .btn-reject { background: #fee2e2; color: #991b1b; }
        .btn-reject:hover { background: #fecaca; }

        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }

        .no-data { text-align: center; padding: 40px; color: #64748b; font-size: 14px; background: var(--card-bg); border-radius: 14px; }
        .error-box { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 10px; font-size: 13px; line-height: 1.6; word-break: break-all; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2><i class="fa-solid fa-lock" style="color: var(--primary);"></i> دخول لوحة الإدارة</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="email" id="emailInput" placeholder="البريد الإلكتروني" required>
                <input type="password" id="passwordInput" placeholder="كلمة المرور" required>
                <button type="submit">تسجيل الدخول</button>
                <div id="loginError" class="login-error">البريد الإلكتروني أو كلمة المرور غير صحيحة!</div>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم المحمية -->
    <div id="adminDashboard" class="container">
        <div class="admin-header">
            <h1><i class="fa-solid fa-user-doctor"></i> لوحة طلبات حجوزات د. محمد إسماعيل</h1>
            <div class="header-left">
                <button class="btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>

        <!-- شريط البحث السريع -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث باسم المريض، رقم الهاتف، رقم الأضبارة، أو البيانات...">
        </div>

        <!-- أزرار الفرز والتبويبات -->
        <div class="filter-tabs">
            <button class="tab-btn active-all" id="tabAll" onclick="setFilter('all')">
                <i class="fa-solid fa-list-check"></i> جميع الطلبات <span id="countAll">0</span>
            </button>
            <button class="tab-btn" id="tabPending" onclick="setFilter('pending')">
                <i class="fa-solid fa-clock-rotate-left"></i> قيد الانتظار <span id="countPending">0</span>
            </button>
            <button class="tab-btn" id="tabAccepted" onclick="setFilter('accepted')">
                <i class="fa-solid fa-circle-check"></i> المؤكدة (المقبولة) <span id="countAccepted">0</span>
            </button>
            <button class="tab-btn" id="tabRejected" onclick="setFilter('rejected')">
                <i class="fa-solid fa-circle-xmark"></i> المرفوضة / الملغاة <span id="countRejected">0</span>
            </button>
        </div>

        <div id="ordersContainer" class="orders-grid">
            <div class="no-data">جاري مزامنة الحجوزات لحظياً...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1jJGXpZJm_SZ4xOsSN2JhDhzsjhx0aRU",
            authDomain: "mohamed-ismail-c0525.firebaseapp.com",
            projectId: "mohamed-ismail-c0525",
            storageBucket: "mohamed-ismail-c0525.firebasestorage.app",
            messagingSenderId: "582285551584",
            appId: "1:582285551584:web:abbb715cb6b70582556d85",
            measurementId: "G-JZ45DZ3ZTP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById("ordersContainer");
        let allAppointments = [];
        let currentFilter = 'all'; // الفلتر الافتراضي
        let searchQuery = ''; // نص البحث

        if (localStorage.getItem("doctorLoggedIn") === "true") {
            showDashboard();
        }

        window.handleLogin = function(event) {
            event.preventDefault();
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();
            const errorDiv = document.getElementById("loginError");

            if (email === "MohamedIsmail123@gmail.com" && password === "Mohamed123") {
                localStorage.setItem("doctorLoggedIn", "true");
                errorDiv.style.display = "none";
                showDashboard();
            } else {
                errorDiv.style.display = "block";
            }
        };

        window.handleLogout = function() {
            localStorage.removeItem("doctorLoggedIn");
            document.getElementById("adminDashboard").style.display = "none";
            document.getElementById("loginOverlay").style.display = "flex";
            document.getElementById("loginForm").reset();
        };

        function showDashboard() {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("adminDashboard").style.display = "block";
            loadAppointments();
        }

        // دالة لتغيير الفلتر عند الضغط على الأزرار
        window.setFilter = function(filterType) {
            currentFilter = filterType;

            document.getElementById("tabAll").className = "tab-btn";
            document.getElementById("tabPending").className = "tab-btn";
            document.getElementById("tabAccepted").className = "tab-btn";
            document.getElementById("tabRejected").className = "tab-btn";

            if (filterType === 'all') document.getElementById("tabAll").className = "tab-btn active-all";
            if (filterType === 'pending') document.getElementById("tabPending").className = "tab-btn active-pending";
            if (filterType === 'accepted') document.getElementById("tabAccepted").className = "tab-btn active-accepted";
            if (filterType === 'rejected') document.getElementById("tabRejected").className = "tab-btn active-rejected";

            renderFilteredAppointments();
        };

        // دالة التعامل مع البحث
        window.handleSearch = function() {
            searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
            renderFilteredAppointments();
        };

        function loadAppointments() {
            onSnapshot(collection(db, "appointments"), (querySnapshot) => {
                allAppointments = [];
                
                querySnapshot.forEach((item) => {
                    allAppointments.push({ id: item.id, ...item.data() });
                });

                // ترتيب الطلبات: الأحدث (الجديد) أولاً بناءً على تاريخ الحجز أو معرف المستند أو الوقت المتاح
                allAppointments.sort((a, b) => {
                    // إذا كان هناك حقل تاريخ/وقت مخزن بشكل منظم (يمكن الاعتماد على معرف المستند أو حقول أخرى مقارنة عكسية)
                    const timeA = a.bookingTime || '';
                    const timeB = b.bookingTime || '';
                    // الترتيب التنازلي (الأحدث أولاً)
                    return b.id.localeCompare(a.id);
                });

                updateCounters();
                renderFilteredAppointments();
            }, (error) => {
                console.error("خطأ الفايربيس:", error);
                container.innerHTML = `
                    <div class="error-box">
                        <strong>حدث خطأ تقني في المزامنة اللحظية:</strong><br>
                        ${error.message}
                    </div>
                `;
            });
        }

        // تحديث أعداد العدادات في التبويبات (تأخذ بعين الاعتبار حالة الطلب فقط بغض النظر عن البحث)
        function updateCounters() {
            const countAll = allAppointments.length;
            const countPending = allAppointments.filter(item => (item.status || "قيد الانتظار") === "قيد الانتظار").length;
            const countAccepted = allAppointments.filter(item => {
                const st = item.status || "";
                return st.includes("مقبول") || st.includes("مؤكد");
            }).length;
            const countRejected = allAppointments.filter(item => {
                const st = item.status || "";
                return st.includes("ملغي") || st.includes("مرفوض");
            }).length;

            document.getElementById("countAll").innerText = countAll;
            document.getElementById("countPending").innerText = countPending;
            document.getElementById("countAccepted").innerText = countAccepted;
            document.getElementById("countRejected").innerText = countRejected;
        }

        // عرض الحجوزات بناءً على الفلتر المختار ونص البحث
        function renderFilteredAppointments() {
            container.innerHTML = "";

            let filteredList = allAppointments.filter(item => {
                const status = item.status || "قيد الانتظار";
                
                // فلترة التبويبات
                let matchesTab = true;
                if (currentFilter === 'pending') matchesTab = (status === "قيد الانتظار");
                else if (currentFilter === 'accepted') matchesTab = (status.includes("مقبول") || status.includes("مؤكد"));
                else if (currentFilter === 'rejected') matchesTab = (status.includes("ملغي") || status.includes("مرفوض"));

                if (!matchesTab) return false;

                // فلترة البحث (الاسم، الهاتف، الإقامة، رقم الأضبارة، تفاصيل الأعراض، إلخ)
                if (searchQuery !== '') {
                    const searchableText = `
                        ${item.username || ''} 
                        ${item.phone || ''} 
                        ${item.residence || ''} 
                        ${item.fileNumber || ''} 
                        ${item.details || ''} 
                        ${item.appointmentDate || ''}
                        ${item.visitType || ''}
                    `.toLowerCase();

                    return searchableText.includes(searchQuery);
                }

                return true;
            });

            if (filteredList.length === 0) {
                container.innerHTML = `<div class="no-data">لا توجد نتائج مطابقة لبحثك أو في هذا القسم حالياً.</div>`;
                return;
            }

            filteredList.forEach((data) => {
                const docId = data.id;
                const status = data.status || "قيد الانتظار";
                const currentQueue = data.queueNumber && data.queueNumber !== "قيد الصدور" ? data.queueNumber : "";
                const currentTime = data.appointmentTime && data.appointmentTime !== "قيد الصدور" ? data.appointmentTime : "";
                
                let statusClass = "status-pending";
                if (status.includes("مقبول") || status.includes("مؤكد")) statusClass = "status-accepted";
                if (status.includes("ملغي") || status.includes("مرفوض")) statusClass = "status-rejected";

                const card = document.createElement("div");
                card.className = "order-card";
                card.innerHTML = `
                    <div class="order-info">
                        <h3>
                            <span><i class="fa-solid fa-user" style="color:var(--primary); margin-left:6px;"></i> المريض: ${data.username || "بدون اسم"}</span>
                            <span class="status-badge ${statusClass}">${status}</span>
                        </h3>

                        <!-- تفاصيل المريض كاملة -->
                        <div class="patient-details-box">
                            <div>العمر: <span>${data.age || "غير متوفر"} سنة</span></div>
                            <div>الإقامة: <span>${data.residence || "غير متوفر"}</span></div>
                            <div>رقم الهاتف: <span dir="ltr">${data.phone || "غير متوفر"}</span></div>
                            <div>نوع الزيارة: <span style="color: #0284c7;">${data.visitType || "عادي"}</span></div>
                            ${data.fileNumber && data.fileNumber !== "لا يوجد" ? `<div>رقم الأضبارة: <span style="color: #7c2d12;">${data.fileNumber}</span></div>` : ''}
                            <div>تاريخ الموعد: <span>${data.appointmentDate || "غير متوفر"}</span></div>
                            <div>توقيت طلب الحجز: <span>${data.bookingTime || "غير متوفر"}</span></div>
                            <div style="grid-column: 1 / -1;">تفاصيل الأعراض: <span style="font-weight:normal; color:#475569;">${data.details || "لا توجد تفاصيل"}</span></div>
                        </div>
                        
                        <!-- حقول إدخال الدور وساعة الحضور -->
                        <div class="inputs-grid">
                            <div class="queue-input-group">
                                <label><i class="fa-solid fa-ticket"></i> رقم الدور:</label>
                                <input type="text" id="queue_${docId}" value="${currentQueue}" placeholder="مثال: 1">
                            </div>
                            <div class="queue-input-group">
                                <label><i class="fa-regular fa-clock"></i> ساعة الحضور:</label>
                                <input type="text" id="time_${docId}" value="${currentTime}" placeholder="مثال: 10:30 صباحاً">
                            </div>
                        </div>

                        <div style="font-size: 11px; color: #94a3b8;">معرف الطلب: ${docId}</div>
                    </div>
                    <div class="order-actions">
                        <button class="btn-action btn-accept" onclick="acceptWithDetails('${docId}')"><i class="fa-solid fa-check"></i> قبول وتحديد الدور وساعة الحضور</button>
                        <button class="btn-action btn-reject" onclick="updateStatus('${docId}', 'ملغي / مرفوض')"><i class="fa-solid fa-xmark"></i> رفض</button>
                        <button class="btn-action" style="background:#fee2e2; color:#991b1b; margin-right:auto;" onclick="deleteOrder('${docId}')"><i class="fa-solid fa-trash"></i> حذف</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // دالة حفظ رقم الدور وساعة الحضور وتغيير الحالة إلى مقبول
        window.acceptWithDetails = async function(id) {
            const queueInput = document.getElementById(`queue_${id}`).value.trim();
            const timeInput = document.getElementById(`time_${id}`).value.trim();
            
            if (!queueInput || !timeInput) {
                alert("الرجاء إدخال كل من (رقم الدور) و(ساعة الحضور) للمريض قبل الضغط على قبول!");
                return;
            }

            try {
                const now = new Date();
                const queueTime = now.toLocaleTimeString('ar-SY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                await updateDoc(doc(db, "appointments", id), { 
                    status: "مقبول / مؤكد",
                    queueNumber: queueInput,
                    appointmentTime: timeInput,
                    queueTime: queueTime
                });
            } catch (e) { 
                alert("خطأ في التحديث: " + e.message); 
            }
        };

        window.updateStatus = async function(id, newStatus) {
            try {
                await updateDoc(doc(db, "appointments", id), { status: newStatus });
            } catch (e) { alert("خطأ في التحديث: " + e.message); }
        };

        window.deleteOrder = async function(id) {
            if (confirm("هل تريد حذف الحجز نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "appointments", id));
                } catch (e) { alert("خطأ في الحذف: " + e.message); }
            }
        }
    </script>
</body>
</html>
