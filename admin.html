<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم دكتور الداخلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); direction: rtl; padding: 20px; }

        .container { max-width: 1000px; margin: 0 auto; }
        
        .admin-header { 
            background: var(--card-bg); padding: 20px 25px; border-radius: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; 
            justify-content: space-between; align-items: center; margin-bottom: 25px; 
        }
        .admin-header h1 { font-size: 20px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .admin-header h1 i { color: var(--primary); }
        
        .badge-count { background: #e0f2fe; color: var(--primary); padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 14px; }

        .orders-grid { display: grid; gap: 15px; }
        
        .order-card { 
            background: var(--card-bg); border-radius: 14px; padding: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
        }
        
        .order-info { margin-bottom: 15px; }
        .order-info h3 { font-size: 16px; color: #0f172a; margin-bottom: 5px; }
        .order-info p { font-size: 14px; color: #475569; margin-bottom: 8px; line-height: 1.6; }
        
        .order-actions { display: flex; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        
        .btn-action { 
            padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; 
            cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; 
        }
        .btn-accept { background: #d1fae5; color: #065f46; }
        .btn-reject { background: #fee2e2; color: #991b1b; }

        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }

        .no-data { text-align: center; padding: 40px; color: #64748b; font-size: 14px; background: var(--card-bg); border-radius: 14px; }
        .error-box { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 10px; font-size: 13px; line-height: 1.6; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-header">
            <h1><i class="fa-solid fa-user-doctor"></i> لوحة طلبات حجوزات عيادة الداخلية</h1>
            <div class="badge-count" id="orderCount">الطلبات: 0</div>
        </div>

        <div id="ordersContainer" class="orders-grid">
            <div class="no-data">جاري الاتصال بقاعدة البيانات...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
            authDomain: "ahmad-662ee.firebaseapp.com",
            projectId: "ahmad-662ee",
            storageBucket: "ahmad-662ee.firebasestorage.app",
            messagingSenderId: "740891153734",
            appId: "1:740891153734:web:d4927b652d05f499618147",
            measurementId: "G-S0ZD5K16NM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchOrders() {
            const container = document.getElementById("ordersContainer");
            const countBadge = document.getElementById("orderCount");

            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = "";
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="no-data">لا توجد حجوزات جديدة حالياً في قاعدة البيانات.</div>`;
                    countBadge.innerText = "الطلبات: 0";
                    return;
                }

                countBadge.innerText = `الطلبات: ${querySnapshot.size}`;

                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const docId = document.id;
                    const status = data.status || "قيد الانتظار";
                    
                    let statusClass = "status-pending";
                    if (status.includes("مقبول")) statusClass = "status-accepted";
                    if (status.includes("ملغي") || status.includes("مرفوض")) statusClass = "status-rejected";

                    const card = document.createElement("div");
                    card.className = "order-card";
                    card.innerHTML = `
                        <div class="order-info">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <h3>اسم المريض: ${data.username || "بدون اسم"}</h3>
                                <span class="status-badge ${statusClass}">${status}</span>
                            </div>
                            <p><strong>التفاصيل:</strong> ${data.details || "لا توجد تفاصيل"}</p>
                            <div style="font-size: 11px; color: #94a3b8;">معرف الطلب: ${docId}</div>
                        </div>
                        <div class="order-actions">
                            <button class="btn-action btn-accept" onclick="updateStatus('${docId}', 'مقبول / مؤكد')">قبول</button>
                            <button class="btn-action btn-reject" onclick="updateStatus('${docId}', 'ملغي / مرفوض')">رفض</button>
                            <button class="btn-action" style="background:#fee2e2; color:#991b1b; margin-right:auto;" onclick="deleteOrder('${docId}')">حذف</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("خطأ الفايربيس:", error);
                container.innerHTML = `
                    <div class="error-box">
                        <strong>حدث خطأ تقني من Firebase:</strong><br>
                        ${error.message} <br><br>
                        <em>تأكد أن خدمة Firestore Database مفعلة في مشروعك وليست Realtime Database، وأن اسم المشروع صحيح.</em>
                    </div>
                `;
            }
        }

        window.updateStatus = async function(id, newStatus) {
            try {
                await updateDoc(doc(db, "orders", id), { status: newStatus });
                fetchOrders();
            } catch (e) { alert("خطأ في التحديث: " + e.message); }
        };

        window.deleteOrder = async function(id) {
            if (confirm("حذف الحجز نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                    fetchOrders();
                } catch (e) { alert("خطأ في الحذف: " + e.message); }
            }
        }

        fetchOrders();
    </script>
</body>
</html>
