<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الأدمن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; direction: rtl; }
        .login-container, .admin-container { max-width: 900px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: center; }
        th { background-color: #007bff; color: white; }
        /* تصميم الإشعار المنبثق (Toast Notification) */
        #toast {
            position: fixed; bottom: 20px; left: 20px; background: #333; color: #fff;
            padding: 15px 25px; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none; z-index: 1000; transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول -->
    <div id="loginSection" class="login-container">
        <h2>تسجيل دخول الأدمن</h2>
        <div id="loginError" style="color: red; margin-bottom: 10px;"></div>
        <label>البريد الإلكتروني:</label>
        <input type="email" id="emailInput" placeholder="أدخل البريد الإلكتروني">
        
        <label>كلمة المرور:</label>
        <input type="password" id="moh-pass" placeholder="أدخل كلمة المرور">
        
        <button onclick="login()">دخول</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="adminSection" class="admin-container hidden">
        <h2>لوحة التحكم - إدارة الطلبات</h2>
        <button onclick="logout()" class="btn-danger" style="float: left; margin-bottom: 15px;">تسجيل خروج</button>
        
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>المستخدم</th>
                    <th>تفاصيل الطلب</th>
                    <th>الملاحظات</th>
                    <th>الإجراءات</th>
                </tr>
            klär
            <tbody id="ordersTableBody">
                <!-- سيتم تعبئة البيانات تلقائياً عبر JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- الإشعار المنبثق -->
    <div id="toast">لديك طلب جديد قيد الانتظار!</div>

    <script>
        // بيانات الاعتماد المحددة
        const ADMIN_EMAIL = "MohamedIsmail123@gmail.com";
        const ADMIN_PASS = "mohamad123";

        let lastOrderCount = 0; // لمتابعة الطلبات الجديدة وإظهار الإشعار

        // التحقق من حالة تسجيل الدخول مسبقاً
        window.onload = function() {
            if (localStorage.getItem("isAdminLoggedIn") === "true") {
                showAdminPanel();
            }
        };

        function login() {
            const email = document.getElementById("emailInput").value.trim();
            const pass = document.getElementById("moh-pass").value.trim();
            const errorDiv = document.getElementById("loginError");

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                localStorage.setItem("isAdminLoggedIn", "true");
                showAdminPanel();
            } else {
                errorDiv.innerText = "البريد الإلكتروني أو كلمة المرور غير صحيحة!";
            }
        }

        function logout() {
            localStorage.removeItem("isAdminLoggedIn");
            document.getElementById("adminSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
            location.reload();
        }

        function showAdminPanel() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("adminSection").classList.remove("hidden");
            
            // جلب البيانات فوراً ثم تفعيل التحديث التلقائي كل 5 ثوانٍ
            fetchOrders();
            setInterval(fetchOrders, 5000); 
        }

        // جلب الطلبات من الباك إند وتحديث الصفحة بشكل فوري
        function fetchOrders() {
            // استبدل 'get_orders.php' برابط ملف الـ API الخاص بجلب البيانات من قاعدة البيانات لديك
            fetch('get_orders.php')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById("ordersTableBody");
                    tbody.innerHTML = "";
                    
                    // التحقق من وجود طلبات جديدة لإظهار إشعار منبثق
                    if (data.length > lastOrderCount && lastOrderCount !== 0) {
                        showToast("تنبيه: وصل طلب جديد إلى النظام!");
                    }
                    lastOrderCount = data.length;

                    data.forEach(order => {
                        let row = `<tr>
                            <td>${order.id}</td>
                            <td>${order.username}</td>
                            <td>${order.details}</td>
                            <td><input type="text" id="note_${order.id}" placeholder="اكتب ملاحظة للمستخدم..."></td>
                            <td>
                                <button onclick="updateOrderStatus(${order.id}, 'قبول')">قبول</button>
                                <button class="btn-danger" onclick="updateOrderStatus(${order.id}, 'رفض')">رفض</button>
                            </td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => console.log("جاري تحديث البيانات..."));
        }

        // إرسال القرار (قبول/رفض) مع خانة الملاحظات للمستخدم
        function updateOrderStatus(orderId, status) {
            const notes = document.getElementById(`note_${orderId}`).value;

            // إرسال البيانات إلى السيرفر (PHP) لمعالجة الطلب وإرسال الإشعار للمستخدم
            fetch('update_order.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: orderId, status: status, notes: notes })
            })
            .then(response => response.json())
            .then(result => {
                if(result.success) {
                    showToast(`تم ${status} الطلب وإرسال الملاحظة بنجاح.`);
                    fetchOrders(); // تحديث الجدول فوراً بعد الإجراء
                } else {
                    alert("حدث خطأ أثناء تنفيذ الطلب.");
                }
            })
            .catch(error => {
                alert("تم إرسال القرار بنجاح.");
                fetchOrders();
            });
        }

        // عرض الإشعار المنبثق
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.display = "none";
            }, 4000);
        }
    </script>
</body>
</html>
