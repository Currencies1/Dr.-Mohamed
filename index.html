<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادة الأمراض الباطنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            direction: rtl; 
            padding: 20px; 
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .form-card { 
            background: var(--card-bg); 
            width: 100%; 
            padding: 35px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0;
        }

        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header .icon-box {
            width: 70px; height: 70px; background: #e0f2fe; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 15px; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.1);
        }
        .form-header h2 { font-weight: 700; color: #0f172a; font-size: 22px; }
        .form-header p { color: #64748b; font-size: 13px; margin-top: 5px; line-height: 1.5; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media(min-width: 550px) {
            .form-grid.two-cols { grid-template-columns: 1fr 1fr; }
        }

        .form-group { margin-bottom: 4px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #334155; }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        input, select, textarea { 
            width: 100%; padding: 12px 16px 12px 45px; border: 1.5px solid var(--border-color); 
            border-radius: 10px; font-size: 14px; outline: none; background: #fff; transition: all 0.3s; color: #1e293b;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12); }
        textarea { padding-right: 45px; resize: none; }

        .section-title {
            font-size: 14px; font-weight: 700; color: var(--primary); margin: 15px 0 10px 0;
            display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 5px;
        }

        .btn-submit { 
            background: var(--primary); color: white; border: none; padding: 14px; 
            border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; 
            font-size: 16px; transition: background 0.3s, transform 0.1s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 20px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        #statusMsg { 
            margin-top: 15px; text-align: center; font-weight: 600; font-size: 13px; 
            padding: 14px; border-radius: 8px; display: none; 
        }
        .success-msg { background: #d1fae5; color: #065f46; display: block !important; }
        .error-msg { background: #fee2e2; color: #991b1b; display: block !important; }
        .loading-msg { background: #e0f2fe; color: #0369a1; display: block !important; }
        .accepted-msg { background: #d1fae5; color: #065f46; border: 2px solid #10b981; display: block !important; font-size: 15px; font-weight: bold; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .rejected-msg { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; display: block !important; font-size: 15px; font-weight: bold; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }

        .doctor-signature {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
        .doctor-signature .patient-quote {
            font-size: 12px;
            color: #64748b;
            font-style: italic;
            margin-bottom: 8px;
        }
        .doctor-signature .doc-name {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .doctor-signature .doc-name i {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <div class="icon-box"><i class="fa-solid fa-user-doctor"></i></div>
                <h2>حجز موعد في عيادة الأمراض الباطنية</h2>
                <p>يرجى تعبئة الحقول أدناه بدقة لضمان سرعة معالجة طلبك وحجز الموعد المناسب</p>
            </div>

            <div class="section-title"><i class="fa-solid id-card"></i> المعلومات الشخصية</div>
            
            <div class="form-grid two-cols">
                <div class="form-group">
                    <label>اسم المريض الثلاثي/الرباعي</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="الاسم الكامل...">
                    </div>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف (للتواصل وتأكيد الحجز)</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone" placeholder="09xxxxxxxx">
                    </div>
                </div>
            </div>

            <div class="section-title"><i class="fa-solid fa-calendar-check"></i> تفاصيل الموعد</div>
            
            <div class="form-group">
                <label>تاريخ الموعد المطلوب</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-calendar-days"></i>
                    <input type="date" id="appointmentDate">
                </div>
            </div>

            <div class="section-title"><i class="fa-solid fa-file-medical"></i> الأعراض والمستلزمات الطبية المصاحبة</div>
            
            <div class="form-group">
                <label>وصف الأعراض أو سبب الزيارة</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-notes-medical" style="top: 25px;"></i>
                    <textarea id="details" rows="2" placeholder="اكتب باختصار الأعراض الرئيسية..."></textarea>
                </div>
            </div>

            <div class="form-group">
                <label>المستلزمات، التقارير أو الأدوية السابقة (إن وجدت)</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-box-archive" style="top: 25px;"></i>
                    <textarea id="medicalSupplies" rows="2" placeholder="ذكر التحاليل السابقة، تقارير سابقة، أو أدوية يتم تناولها حالياً..."></textarea>
                </div>
            </div>

            <button type="button" id="submitBtn" class="btn-submit" onclick="sendOrder()">
                <span id="btnText">إرسال طلب الحجز للطبيب</span>
                <i class="fa-solid fa-paper-plane" id="btnIcon"></i>
            </button>

            <div id="statusMsg"></div>

            <div class="doctor-signature">
                <p class="patient-quote">"صحتك أمانة، نعتني بك بعناية واهتمام دائم"</p>
                <div class="doc-name">
                    <i class="fa-solid fa-stethoscope"></i> إشراف وإدارة: د. محمد الأسماعيل <span style="font-size: 12px; color: #64748b; font-weight: 400;">(استشاري الأمراض الباطنية)</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVJclfpEp9Jo9879C3RfZKiEdBUibwrxI",
            authDomain: "ahmad-662ee.firebaseapp.com",
            projectId: "ahmad-662ee",
            storageBucket: "ahmad-662ee.firebasestorage.app",
            messagingSenderId: "740891153734",
            appId: "1:740891153734:web:d4927b652d05f499618147",
            measurementId: "G-S0ZD5K16NM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cooldownTimer = null;
        let unsubscribeStatus = null;

        window.sendOrder = async function() {
            const username = document.getElementById("username").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const appointmentDate = document.getElementById("appointmentDate").value;
            const details = document.getElementById("details").value.trim();
            const supplies = document.getElementById("medicalSupplies").value.trim() || "لا توجد مستلزمات أو تقارير مضافة";
            const statusMsg = document.getElementById("statusMsg");
            const submitBtn = document.getElementById("submitBtn");
            const btnText = document.getElementById("btnText");
            const btnIcon = document.getElementById("btnIcon");

            if (!username || !phone || !appointmentDate || !details) {
                statusMsg.className = "error-msg";
                statusMsg.innerText = "الرجاء تعبئة الحقول الأساسية المطلوبة للحجز!";
                return;
            }

            statusMsg.className = "loading-msg";
            statusMsg.innerText = "جاري إرسال حجزك للعيادة...";

            try {
                const formattedDetails = `التاريخ: ${appointmentDate} | الهاتف: ${phone} \nالأعراض: ${details} \nالمستلزمات والتقارير: ${supplies}`;

                // حفظ الطلب في قاعدة البيانات
                const docRef = await addDoc(collection(db, "orders"), {
                    username: username,
                    details: formattedDetails,
                    status: "قيد الانتظار",
                    createdAt: new Date().toISOString()
                });

                statusMsg.className = "success-msg";
                statusMsg.innerText = "تم إرسال طلب حجز الموعد بنجاح! بانتظار رد الطبيب...";

                // تفريغ الحقول بعد النجاح
                document.getElementById("username").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("appointmentDate").value = "";
                document.getElementById("details").value = "";
                document.getElementById("medicalSupplies").value = "";

                // الاستماع اللحظي لتغيير حالة الطلب (مقبول أو مرفوض)
                if (unsubscribeStatus) unsubscribeStatus(); 
                unsubscribeStatus = onSnapshot(doc(db, "orders", docRef.id), (docSnap) => {
                    if (docSnap.exists()) {
                        const currentStatus = docSnap.data().status;
                        
                        if (currentStatus === "مقبول") {
                            statusMsg.className = "accepted-msg";
                            statusMsg.innerHTML = `<i class="fa-solid fa-circle-check"></i> مبروك! تم **قبول** طلب حجز موعدك من قِبل د. محمد الأسماعيل. ننتظر زيارتك.`;
                        } else if (currentStatus === "مرفوض") {
                            statusMsg.className = "rejected-msg";
                            statusMsg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> نعتذر منك، تم **رفض** طلب الحجز الحالي. يمكنك المحاولة لاحقاً.`;
                        }
                    }
                });

                // تفعيل عداد الـ 29 ثانية لمنع الإرسال المتكرر
                let timeLeft = 29;
                submitBtn.disabled = true;
                btnIcon.className = "fa-solid fa-lock";

                if (cooldownTimer) clearInterval(cooldownTimer);
                
                cooldownTimer = setInterval(() => {
                    if (timeLeft > 0) {
                        btnText.innerText = `يرجى الانتظار (${timeLeft} ثانية) لإرسال طلب آخر`;
                        timeLeft--;
                    } else {
                        clearInterval(cooldownTimer);
                        submitBtn.disabled = false;
                        btnText.innerText = "إرسال طلب الحجز للطبيب";
                        btnIcon.className = "fa-solid fa-paper-plane";
                    }
                }, 1000);

            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                statusMsg.className = "error-msg";
                statusMsg.innerText = "فشل إرسال الحجز! يرجى التحقق من الاتصال بالإنترنت.";
            }
        };
    </script>
</body>
</html>
