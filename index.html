<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادة الأمراض الباطنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            direction: rtl; 
            padding: 20px; 
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .form-card { 
            background: var(--card-bg); 
            width: 100%; 
            padding: 35px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0;
        }

        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header .icon-box {
            width: 70px; height: 70px; background: #e0f2fe; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 15px; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.1);
        }
        .form-header h2 { font-weight: 700; color: #0f172a; font-size: 22px; }
        .form-header p { color: #64748b; font-size: 13px; margin-top: 5px; line-height: 1.5; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media(min-width: 550px) {
            .form-grid.two-cols { grid-template-columns: 1fr 1fr; }
        }

        .form-group { margin-bottom: 4px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #334155; }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        input, select, textarea { 
            width: 100%; padding: 12px 16px 12px 45px; border: 1.5px solid var(--border-color); 
            border-radius: 10px; font-size: 14px; outline: none; background: #fff; transition: all 0.3s; color: #1e293b;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12); }
        textarea { padding-right: 45px; resize: none; }

        .section-title {
            font-size: 14px; font-weight: 700; color: var(--primary); margin: 15px 0 10px 0;
            display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 5px;
        }

        .btn-submit { 
            background: var(--primary); color: white; border: none; padding: 14px; 
            border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; 
            font-size: 16px; transition: background 0.3s, transform 0.1s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 20px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        #statusMsg { 
            margin-top: 20px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 14px; 
            padding: 15px; 
            border-radius: 10px; 
            display: none; 
            line-height: 1.6;
        }
        .success-msg { background: #d1fae5; color: #065f46; border: 1px solid #10b981; display: block !important; }
        .error-msg { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; display: block !important; }
        .loading-msg { background: #e0f2fe; color: #0369a1; border: 1px solid #0284c7; display: block !important; }
        .accepted-msg { background: #d1fae5; color: #065f46; border: 2px solid #10b981; display: block !important; font-size: 16px; font-weight: bold; }
        .rejected-msg { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; display: block !important; font-size: 16px; font-weight: bold; }

        .doctor-signature {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
        .doctor-signature .patient-quote {
            font-size: 12px;
            color: #64748b;
            font-style: italic;
            margin-bottom: 8px;
        }
        .doctor-signature .doc-name {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .doctor-signature .doc-name i {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card" id="mainCard">
            <div class="form-header">
                <div class="icon-box"><i class="fa-solid fa-user-doctor"></i></div>
                <h2>حجز موعد في عيادة الأمراض الباطنية</h2>
                <p>يرجى تعبئة الحقول أدناه بدقة لضمان سرعة معالجة طلبك وحجز الموعد المناسب</p>
            </div>

            <div id="formFieldsContainer">
                <div class="section-title"><i class="fa-solid fa-id-card"></i> المعلومات الشخصية</div>
                
                <div class="form-grid two-cols">
                    <div class="form-group">
                        <label>اسم المريض الثلاثي/الرباعي</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="username" placeholder="الاسم الكامل...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>رقم الهاتف (للتواصل وتأكيد الحجز)</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="phone" placeholder="09xxxxxxxx">
                        </div>
                    </div>
                </div>

                <div class="section-title"><i class="fa-solid fa-calendar-check"></i> تفاصيل الموعد</div>
                
                <div class="form-group">
                    <label>تاريخ الموعد المطلوب</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-calendar-days"></i>
                        <input type="date" id="appointmentDate">
                    </div>
                </div>

                <div class="section-title"><i class="fa-solid fa-file-medical"></i> الأعراض والمستلزمات الطبية المصاحبة</div>
                
                <div class="form-group">
                    <label>وصف الأعراض أو سبب الزيارة</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-notes-medical" style="top: 25px;"></i>
                        <textarea id="details" rows="2" placeholder="اكتب باختصار الأعراض الرئيسية..."></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>المستلزمات، التقارير أو الأدوية السابقة (إن وجدت)</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-box-archive" style="top: 25px;"></i>
                        <textarea id="medicalSupplies" rows="2" placeholder="ذكر التحاليل السابقة، تقارير سابقة، أو أدوية يتم تناولها حالياً..."></textarea>
                    </div>
                </div>

                <button type="button" id="submitBtn" class="btn-submit" onclick="sendOrder()">
                    <span id="btnText">إرسال طلب الحجز للطبيب</span>
                    <i class="fa-solid fa-paper-plane" id="btnIcon"></i>
                </button>
            </div>

            <div id="statusMsg"></div>

            <div class="doctor-signature">
                <p class="patient-quote">"صحتك أمانة، نعتني بك بعناية واهتمام دائم"</p>
                <div class="doc-name">
                    <i class="fa-solid fa-stethoscope"></i> إشراف وإدارة: د. محمد الأسماعيل <span style="font-size: 12px; color: #64748b; font-weight: 400;">(استشاري الأمراض الباطنية)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- كود ربط Firebase المحدث مع الحفظ عبر التحديث والقدرة على تسجيل مريض آخر -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1jJGXpZJm_SZ4xOsSN2JhDhzsjhx0aRU",
            authDomain: "mohamed-ismail-c0525.firebaseapp.com",
            projectId: "mohamed-ismail-c0525",
            storageBucket: "mohamed-ismail-c0525.firebasestorage.app",
            messagingSenderId: "582285551584",
            appId: "1:582285551584:web:abbb715cb6b70582556d85",
            measurementId: "G-JZ45DZ3ZTP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let unsubscribeLive = null;

        // دالة لإخفاء حقول الإدخال وإظهار رسالة الانتظار الثابتة
        function lockScreenToWaiting() {
            document.getElementById("formFieldsContainer").style.display = "none";
            const statusMsg = document.getElementById("statusMsg");
            statusMsg.className = "loading-msg";
            statusMsg.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> تم إرسال الطلب بنجاح!<br><b>يرجى الانتظار وعدم مغادرة الصفحة حتى يتم تأكيد الحجز من قِبل الطبيب...</b>`;
        }

        // التحقق عند فتح أو تحديث الصفحة إذا كان هناك طلب سابق قيد الانتظار
        window.addEventListener("DOMContentLoaded", () => {
            const savedDocId = localStorage.getItem("current_appointment_id");
            if (savedDocId) {
                lockScreenToWaiting();
                monitorAppointment(savedDocId);
            }
        });

        window.sendOrder = async function() {
            const username = document.getElementById("username").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const appointmentDate = document.getElementById("appointmentDate").value;
            const details = document.getElementById("details").value.trim();
            const supplies = document.getElementById("medicalSupplies").value.trim() || "لا توجد مستلزمات مضافة";
            const statusMsg = document.getElementById("statusMsg");

            if (!username || !phone || !appointmentDate || !details) {
                statusMsg.className = "error-msg";
                statusMsg.innerText = "الرجاء تعبئة الحقول الأساسية المطلوبة للحجز!";
                return;
            }

            statusMsg.className = "loading-msg";
            statusMsg.innerText = "جاري إرسال حجزك للعيادة...";

            try {
                const formattedDetails = `التاريخ: ${appointmentDate} | الهاتف: ${phone} \nالأعراض: ${details} \nالمستلزمات: ${supplies}`;

                const docRef = await addDoc(collection(db, "appointments"), {
                    username: username,
                    details: formattedDetails,
                    status: "قيد الانتظار",
                    createdAt: new Date().toISOString()
                });

                // حفظ معرف الطلب في التذاكر المحلية لكي يظل ثابتاً حتى لو حدث تحديث للصفحة
                localStorage.setItem("current_appointment_id", docRef.id);

                // إخفاء الحقول وتثبيت شاشة الانتظار
                lockScreenToWaiting();
                monitorAppointment(docRef.id);

            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                statusMsg.className = "error-msg";
                statusMsg.innerText = "فشل إرسال الحجز! تحقق من اتصال الإنترنت.";
            }
        };

        function monitorAppointment(docId) {
            if (unsubscribeLive) unsubscribeLive();

            const statusMsg = document.getElementById("statusMsg");

            unsubscribeLive = onSnapshot(doc(db, "appointments", docId), (docSnap) => {
                if (docSnap.exists()) {
                    const currentStatus = docSnap.data().status;

                    if (currentStatus.includes("مقبول") || currentStatus.includes("مؤكد")) {
                        statusMsg.className = "accepted-msg";
                        statusMsg.innerHTML = `
                            <i class="fa-solid fa-circle-check" style="font-size: 24px; margin-bottom: 8px; display: block;"></i>
                            مبروك! تم <b>قبول وتأكيد</b> طلب حجز موعدك من قِبل د. محمد الأسماعيل.<br><br>
                            <button onclick="resetForNewPatient()" style="background: #065f46; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo';">
                                <i class="fa-solid fa-user-plus"></i> تسجل لمريض آخر
                            </button>
                        `;
                    } else if (currentStatus.includes("مرفوض") || currentStatus.includes("ملغي")) {
                        statusMsg.className = "rejected-msg";
                        statusMsg.innerHTML = `
                            <i class="fa-solid fa-circle-xmark" style="font-size: 24px; margin-bottom: 8px; display: block;"></i>
                            نعتذر منك، تم <b>رفض</b> طلب الحجز الحالي من قِبل الطبيب.<br><br>
                            <button onclick="resetForNewPatient()" style="background: #991b1b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo';">
                                <i class="fa-solid fa-rotate-right"></i> محاولة حجز جديدة / لمريض آخر
                            </button>
                        `;
                    }
                } else {
                    // في حال تم حذف الطلب من قاعدة البيانات
                    statusMsg.className = "error-msg";
                    statusMsg.innerHTML = `عذراً، لم يتم العثور على هذا الطلب.<br><br>
                        <button onclick="resetForNewPatient()" style="background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo';">تسجيل مريض جديد</button>
                    `;
                }
            });
        }

        // دالة لإعادة ضبط الصفحة لتسجيل مريض آخر
        window.resetForNewPatient = function() {
            localStorage.removeItem("current_appointment_id");
            if (unsubscribeLive) unsubscribeLive();
            
            // إظهار حقول النموذج مرة أخرى وإفريغها
            document.getElementById("formFieldsContainer").style.display = "block";
            document.getElementById("statusMsg").style.display = "none";
            document.getElementById("username").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("appointmentDate").value = "";
            document.getElementById("details").value = "";
            document.getElementById("medicalSupplies").value = "";
        };
    </script>
</body>
</html>
