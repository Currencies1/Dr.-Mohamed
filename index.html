<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تقديم الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            direction: rtl; 
            padding: 20px; 
        }

        .form-card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 450px; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header .icon-box {
            width: 60px; height: 60px; background: #e0e7ff; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 15px;
        }
        .form-header h2 { font-weight: 700; color: var(--text-color); font-size: 22px; }
        .form-header p { color: #64748b; font-size: 13px; margin-top: 5px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        input, textarea { 
            width: 100%; padding: 12px 16px 12px 45px; border: 1.5px solid var(--border-color); 
            border-radius: 12px; font-size: 14px; outline: none; background: #fff; transition: all 0.3s; 
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        textarea { padding-right: 45px; resize: none; }

        .btn-submit { 
            background: var(--primary); color: white; border: none; padding: 14px; 
            border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; 
            font-size: 16px; transition: background 0.3s, transform 0.1s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:active { transform: scale(0.98); }

        #statusMsg { 
            margin-top: 20px; text-align: center; font-weight: 600; font-size: 14px; 
            padding: 10px; border-radius: 8px; display: none; 
        }
        .success-msg { background: #d1fae5; color: #065f46; display: block !important; }
        .error-msg { background: #fee2e2; color: #991b1b; display: block !important; }
        .loading-msg { background: #e0e7ff; color: #3730a3; display: block !important; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <div class="icon-box"><i class="fa-solid fa-paper-plane"></i></div>
            <h2>تقديم طلب جديد</h2>
            <p>املأ البيانات أدناه وسيتم إرسالها إلى الإدارة مباشرة</p>
        </div>

        <div class="form-group">
            <label>اسم المستخدم</label>
            <div class="input-with-icon">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="أدخل اسمك الكريم">
            </div>
        </div>

        <div class="form-group">
            <label>تفاصيل الطلب</label>
            <div class="input-with-icon">
                <i class="fa-solid fa-pen-to-square" style="top: 25px;"></i>
                <textarea id="details" rows="4" placeholder="اكتب تفاصيل طلبك بوضوح..."></textarea>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="sendOrder()">
            <span>إرسال الطلب</span>
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div id="statusMsg"></div>
    </div>

    <!-- كود ربط Firebase والتحكم بالإرسال -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "BLMrzNXetbELyqmG-IA9NyZi5EiR2I351vxTOKG5nAz257H8bj9WLc2njSIq7__fwXvwk1HH3Cmkp_VoZ-h3Lx4",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "xxxxxx",
            appId: "xxxxxx"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendOrder = async function() {
            const usernameInput = document.getElementById("username");
            const detailsInput = document.getElementById("details");
            const statusMsg = document.getElementById("statusMsg");

            const username = usernameInput.value.trim();
            const details = detailsInput.value.trim();

            if (!username || !details) {
                statusMsg.className = "error-msg";
                statusMsg.innerText = "الرجاء تعبئة جميع الحقول قبل الإرسال!";
                return;
            }

            statusMsg.className = "loading-msg";
            statusMsg.innerText = "جاري إرسال الطلب إلى النظام...";

            try {
                await addDoc(collection(db, "orders"), {
                    username: username,
                    details: details,
                    status: "قيد الانتظار",
                    notes: "",
                    createdAt: new Date().toISOString()
                });

                statusMsg.className = "success-msg";
                statusMsg.innerText = "تم إرسال طلبك بنجاح وسيتم متابعته من الإدارة!";
                
                // تفريغ الحقول بعد النجاح
                usernameInput.value = "";
                detailsInput.value = "";

                // إخفاء الرسالة بعد 5 ثوانٍ
                setTimeout(() => { statusMsg.style.display = "none"; }, 5000);

            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                statusMsg.className = "error-msg";
                statusMsg.innerText = "فشل الإرسال! تحقق من اتصال الإنترنت أو إعدادات القاعدة.";
            }
        };
    </script>
</body>
</html>
