<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة المستخدم - إرسال الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; padding: 40px; direction: rtl; }
        .form-container { max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: #4f46e5; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px; }
        button:hover { background: #4338ca; }
        #statusMsg { margin-top: 15px; text-align: center; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>تقديم طلب جديد</h2>
        <div class="form-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="username" placeholder="أدخل اسمك الكريم">
        </div>
        <div class="form-group">
            <label>تفاصيل الطلب:</label>
            <textarea id="details" rows="4" placeholder="اكتب تفاصيل طلبك هنا..."></textarea>
        </div>
        <button type="button" onclick="sendOrder()">إرسال الطلب للإدارة</button>
        <div id="statusMsg"></div>
    </div>

    <!-- ربط Firebase وإرسال البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "BLMrzNXetbELyqmG-IA9NyZi5EiR2I351vxTOKG5nAz257H8bj9WLc2njSIq7__fwXvwk1HH3Cmkp_VoZ-h3Lx4",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "xxxxxx",
            appId: "xxxxxx"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جعل الدالة متاحة عالمياً لتعمل مع زر الـ onclick
        window.sendOrder = async function() {
            const usernameInput = document.getElementById("username");
            const detailsInput = document.getElementById("details");
            const statusMsg = document.getElementById("statusMsg");

            const username = usernameInput.value.trim();
            const details = detailsInput.value.trim();

            if (!username || !details) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "الرجاء تعبئة جميع الحقول قبل الإرسال!";
                return;
            }

            statusMsg.style.color = "#4f46e5";
            statusMsg.innerText = "جاري إرسال الطلب...";

            try {
                await addDoc(collection(db, "orders"), {
                    username: username,
                    details: details,
                    status: "قيد الانتظار",
                    notes: "",
                    createdAt: new Date().toISOString()
                });

                statusMsg.style.color = "green";
                statusMsg.innerText = "تم إرسال طلبك بنجاح وسيظهر لدى الإدارة فوراً!";
                
                // تفريغ الحقول بعد الإرسال الناجح
                usernameInput.value = "";
                detailsInput.value = "";

            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                statusMsg.style.color = "red";
                statusMsg.innerText = "فشل الإرسال! تحقق من اتصال الإنترنت أو إعدادات قاعدة البيانات.";
            }
        };
    </script>
</body>
</html>
