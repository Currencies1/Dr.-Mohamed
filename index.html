<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد طبي - المركز الطبي المتخصص</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-indigo-700 text-white py-5 shadow-lg">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">المركز الطبي المتخصص</h1>
            <button onclick="requestNotificationPermission()" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-400/30 transition">تفعيل الإشعارات 🔔</button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 max-w-2xl">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-slate-100">
            <div class="mb-8 border-b pb-4 border-slate-100">
                <h2 class="text-2xl font-bold text-slate-900">حجز موعد جديد</h2>
                <p class="text-slate-500 text-sm mt-1">أدخل بياناتك وسيصل الطلب مباشرة للإدارة</p>
            </div>
            
            <form id="bookingForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">الاسم الثلاثي <span class="text-rose-500">*</span></label>
                    <input type="text" id="patientName" placeholder="أدخل اسمك الثلاثي" required class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">رقم الهاتف <span class="text-rose-500">*</span></label>
                        <input type="tel" id="patientPhone" placeholder="09xxxxxxxx" required class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">العمر <span class="text-rose-500">*</span></label>
                        <input type="number" id="patientAge" placeholder="مثال: 30" required min="1" max="120" class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">نوع الحجز <span class="text-rose-500">*</span></label>
                    <select id="bookingType" required onchange="handleTypeChange()" class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white transition">
                        <option value="">-- اختر قسم الحجز --</option>
                        <option value="داخلي">قسم باطنية (داخلي)</option>
                        <option value="أطفال">قسم الأطفال</option>
                    </select>
                </div>

                <div id="childSection" class="hidden bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700">اسم الطفل</label>
                            <input type="text" id="childName" placeholder="اسم الطفل الكامل" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-slate-700">عمر الطفل</label>
                            <input type="text" id="childAge" placeholder="مثال: سنتان" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-700">ترتيبات وملاحظات الحجز</label>
                        <textarea id="childRequirements" rows="3" placeholder="ملاحظات خاصة..." class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white"></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">التاريخ <span class="text-rose-500">*</span></label>
                        <input type="date" id="appointmentDate" required class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">الوقت <span class="text-rose-500">*</span></label>
                        <input type="time" id="appointmentTime" required class="w-full p-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition duration-200 text-lg">
                    تأكيد الحجز
                </button>
            </form>

            <div id="statusMessage" class="hidden mt-6 p-4 rounded-xl text-center font-medium"></div>
        </div>
    </main>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeDocId = null;

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(p => {
                    if (p === "granted") alert("تم تفعيل الإشعارات بنجاح!");
                });
            }
        }

        function handleTypeChange() {
            const bookingType = document.getElementById('bookingType').value;
            document.getElementById('childSection').classList.toggle('hidden', bookingType !== 'أطفال');
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "جاري الإرسال...";

            const bookingType = document.getElementById('bookingType').value;
            
            const bookingData = {
                fullName: document.getElementById('patientName').value,
                phone: document.getElementById('patientPhone').value,
                age: document.getElementById('patientAge').value,
                type: bookingType,
                date: document.getElementById('appointmentDate').value,
                time: document.getElementById('appointmentTime').value,
                childInfo: bookingType === 'أطفال' ? {
                    childName: document.getElementById('childName').value,
                    childAge: document.getElementById('childAge').value,
                    requirements: document.getElementById('childRequirements').value
                } : null,
                status: 'قيد الانتظار',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                const docRef = await db.collection('appointments').add(bookingData);
                activeDocId = docRef.id;

                const msg = document.getElementById('statusMessage');
                msg.className = "mt-6 p-4 rounded-xl text-center font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
                msg.textContent = "تم إرسال طلب الحجز بنجاح! نرجو عدم إغلاق الصفحة لتلقي إشعار القبول.";
                msg.classList.remove('hidden');

                listenForApproval(activeDocId);
                this.reset();
                handleTypeChange();
            } catch (err) {
                alert("حدث خطأ أثناء إرسال الطلب: " + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "تأكيد الحجز";
            }
        });

        function listenForApproval(docId) {
            db.collection('appointments').doc(docId).onSnapshot(snapshot => {
                const data = snapshot.data();
                if (data && data.status === 'مؤكد') {
                    if (Notification.permission === "granted") {
                        new Notification("المركز الطبي", {
                            body: `تم تأكيد حجزك بنجاح لموعد: ${data.date}`,
                            icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png"
                        });
                    } else {
                        alert(`🎉 تم تأكيد حجزك بنجاح! التاريخ: ${data.date}`);
                    }
                }
            });
        }
    </script>
</body>
</html>
