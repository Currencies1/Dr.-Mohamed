<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد طبي - عيادة الباطنية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-indigo-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">المركز الطبي - قسم الباطنية</h1>
            <a href="admin.html" class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg text-sm transition">لوحة الإدارة</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-2xl">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6">حجز موعد عيادة الباطنية</h2>
            
            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">اسم المريض الكامل</label>
                    <input type="text" id="patientName" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">رقم الهاتف</label>
                    <input type="tel" id="patientPhone" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">اختر أخصائي الباطنية</label>

                    <select id="doctorSelect" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- اختر طبيب الباطنية --</option>
                        <option value="د. محمد - أخصائي أمراض باطنية وهضمية">د. محمد - أخصائي أمراض باطنية وهضمية</option>
                        <option value="د. سامر - أمراض باطنية وقلبية">د. سامر - أمراض باطنية وقلبية</option>
                        <option value="د. ريم - أمراض الغدد والصماء">د. ريم - أمراض الغدد والصماء</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">تاريخ الموعد</label>
                        <input type="date" id="appointmentDate" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">الوقت</label>
                        <input type="time" id="appointmentTime" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 mt-4">
                    تأكيد الحجز
                </button>
            </form>
            <div id="statusMessage" class="hidden mt-4 p-4 rounded-xl text-center font-medium"></div>
        </div>
    </main>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const booking = {
                id: Date.now(),
                name: document.getElementById('patientName').value,
                phone: document.getElementById('patientPhone').value,
                doctor: document.getElementById('doctorSelect').value,
                date: document.getElementById('appointmentDate').value,
                time: document.getElementById('appointmentTime').value,
                status: 'قيد الانتظار'
            };

            let appointments = JSON.parse(localStorage.getItem('appointments')) || [];
            appointments.push(booking);
            localStorage.setItem('appointments', JSON.stringify(appointments));

            const msg = document.getElementById('statusMessage');
            msg.className = "mt-4 p-4 rounded-xl text-center font-medium bg-emerald-100 text-emerald-700";
            msg.textContent = "تم تسجيل طلبك في قسم الباطنية بنجاح!";
            msg.classList.remove('hidden');

            this.reset();
        });
    </script>
</body>
</html>
