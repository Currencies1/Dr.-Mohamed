<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تقديم الطلبات الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            direction: rtl; 
            padding: 20px; 
        }

        .form-card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 550px; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
        }

        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header .icon-box {
            width: 60px; height: 60px; background: #e0e7ff; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 15px;
        }
        .form-header h2 { font-weight: 700; color: var(--text-color); font-size: 22px; }
        .form-header p { color: #64748b; font-size: 13px; margin-top: 5px; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        input, select, textarea { 
            width: 100%; padding: 12px 16px 12px 45px; border: 1.5px solid var(--border-color); 
            border-radius: 10px; font-size: 14px; outline: none; background: #fff; transition: all 0.3s; 
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        textarea { padding-right: 45px; resize: none; }

        .btn-submit { 
            background: var(--primary); color: white; border: none; padding: 14px; 
            border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; 
            font-size: 16px; transition: background 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); }

        #statusMsg { 
            margin-top: 15px; text-align: center; font-weight: 600; font-size: 13px; 
            padding: 10px; border-radius: 8px; display: none; 
        }
        .success-msg { background: #d1fae5; color: #065f46; display: block !important; }
        .error-msg { background: #fee2e2; color: #991b1b; display: block !important; }
        .loading-msg { background: #e0e7ff; color: #3730a3; display: block !important; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <div class="icon-box"><i class="fa-solid fa-file-lines"></i></div>
            <h2>نموذج الطلب المتكامل</h2>
            <p>أدخل تفاصيل طلبك بدقة لضمان معالجته من قبل الإدارة</p>
        </div>

        <div class="form-group">
            <label>اسم المستخدم الثلاثي</label>
            <div class="input-with-icon">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="مثال: أحمد محمد...">
            </div>
        </div>

        <div class="form-group">
            <label>نوع الطلب / القسم</label>
            <div class="input-with-icon">
                <i class="fa-solid fa-list-check"></i>
                <select id="orderType">
                    <option value="" disabled selected>اختر تصنيف الطلب</option>
                    <option value="دعم فني وتقني">دعم فني وتقني</option>
                    <option value="طلب استفسار أو مساعدة">طلب استفسار أو مساعدة</option>
                    <option value="تفعيل حساب أو صلاحية">تفعيل حساب أو صلاحية</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>رقم الهاتف أو وسيلة التواصل</label>
            <div class="input-with-icon">
                <i class="fa-solid fa-phone"></i>
                <input type="text" id="phone" placeholder="أدخل رقم الهاتف للتواصل">
            </div>
        </div>

        <div class="form-group">
            <label>تفاصيل الطلب الكاملة</label>
            <div class="input-with-icon">
                <i class="fa-solid fa-pen-to-square" style="top: 25px;"></i>
                <textarea id="details" rows="3" placeholder="اشرح طلبك بالتفصيل..."></textarea>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="sendOrder()">
            <span>إرسال الطلب الآن</span>
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div id="statusMsg"></div>
    </div>

    <!-- كود ربط Firebase وإرسال البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "BLMrzNXetbELyqmG-IA9NyZi5EiR2I351vxTOKG5nAz257H8bj9WLc2njSIq7__fwXvwk1HH3Cmkp_VoZ-h3Lx4",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "xxxxxx",
            appId: "xxxxxx"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendOrder = async function() {
            const username = document.getElementById("username").value.trim();
            const orderType = document.getElementById("orderType").value;
            const phone = document.getElementById("phone").value.trim();
            const details = document.getElementById("details").value.trim();
            const statusMsg = document.getElementById("statusMsg");

            if (!username || !orderType || !phone || !details) {
                statusMsg.className = "error-msg";
                statusMsg.innerText = "الرجاء تعبئة كافة الحقول المطلوبة بالتفصيل!";
                return;
            }

            statusMsg.className = "loading-msg";
            statusMsg.innerText = "جاري إرسال طلبك لقاعدة البيانات...";

            try {
                const fullDetails = `[التصنيف: ${orderType}] - [الهاتف: ${phone}] - التفاصيل: ${details}`;

                await addDoc(collection(db, "orders"), {
                    username: username,
                    details: fullDetails,
                    status: "قيد الانتظار",
                    notes: "",
                    createdAt: new Date().toISOString()
                });

                statusMsg.className = "success-msg";
                statusMsg.innerText = "تم إرسال طلبك بنجاح وسيظهر لدى الإدارة فوراً!";
                
                document.getElementById("username").value = "";
                document.getElementById("orderType").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("details").value = "";

            } catch (error) {
                console.error("خطأ في الإرسال:", error);
                statusMsg.className = "error-msg";
                statusMsg.innerText = "فشل الإرسال! تأكد من صحة إعدادات Firebase وقواعد الحماية.";
            }
        };
    </script>
</body>
</html>
